<h2 mat-dialog-title>Edit Sensor Type</h2>
<mat-dialog-content class="w-full">
    <div class="flex flex-col">
        <ng-select
          appearance="outline"
          [items]="sensorTypes"
          [loading]="loading()"
          bindLabel="name"
          [(ngModel)]="type"
          [virtualScroll]="true"
          appendTo="body"
          (scrollToEnd)="onScrollToEnd()"
          placeholder="Select an item">
        </ng-select>

        <mat-form-field>
          <mat-label>Name</mat-label>
          <input matInput [(ngModel)]="name" />
        </mat-form-field>

        <mat-form-field>
          <mat-label>Description</mat-label>
          <textarea matInput [(ngModel)]="description"></textarea>
        </mat-form-field>
    </div>
</mat-dialog-content>
<mat-dialog-actions class="!justify-between">
    @if (data) {
      <button mat-stroked-button class="!text-red-700" (click)="onDelete()" [disabled]="isBusy()">
        <span class="flex items-center gap-4">
          @if (isBusy()) {
            <mat-spinner [diameter]="15" />
          }
          <span>Delete</span>
        </span>
      </button>
    }
    @else {
      <span></span>
    }
    <div>
      <button mat-button (click)="onCancel()" [disabled]="isBusy()">
        <span class="flex items-center gap-4">
          @if (isBusy()) {
            <mat-spinner [diameter]="15" />
          }
          <span>Cancel</span>
        </span>
      </button>
      <button mat-button (click)="onSave()" cdkFocusInitial
        [disabled]="isBusy()">
        <span class="flex items-center gap-4">
          @if (isBusy()) {
            <mat-spinner [diameter]="15" />
          }
          <span>Save</span>
        </span>
      </button>
    </div>
</mat-dialog-actions>
