<mat-sidenav-container class="h-full">
  <mat-sidenav mode="side" opened>
    <nav class="h-full flex flex-col justify-between">
      <div>
        <div class="flex justify-center mt-6">
          <a id="title" routerLink="/">
            <span>S</span>
            <span>E</span>
            <span>N</span>
            <span>S</span>
            <span>O</span>
            <span>R</span>
            <span>S</span>
            <span>_</span>
            <span>S</span>
            <span>Y</span>
            <span>S</span>
            <span>T</span>
            <span>E</span>
            <span>M</span>
          </a>
        </div>
        <mat-nav-list class="!p-2 !pt-4 !mt-2">
          @for (item of publicNavbarLinks; track item.url) {
            <a mat-list-item
              class="my-2"
              routerLinkActive="active"
              [routerLink]="item.url"
              [routerLinkActiveOptions]="{ exact: true }">{{ item.title }}</a>
          }

          @if (authService.isLoggedIn()) {
            <mat-divider class="!border-stone-400" />

            @for (item of authorizedNavbarLinks; track item.url) {
              <a mat-list-item
                class="my-2"
                routerLinkActive="active"
                [routerLink]="item.url"
                [routerLinkActiveOptions]="{ exact: true }">{{ item.title }}</a>
            }
          }
        </mat-nav-list>
      </div>
      <div class="p-2">
        @if (authService.isLoggedIn()) {
          <button mat-stroked-button class="w-full" (click)="authService.logout()">Log out</button>
        }
        @else {
          <button mat-stroked-button class="w-full flex items-center gap-2"
            (click)="authService.login()"
            [disabled]="authService.isAuthOperationInProgress()">
            <span class="flex items-center gap-4">
              @if (authService.isAuthOperationInProgress()) {
                <mat-spinner [diameter]="15" />
              }
              <span>Log in</span>
            </span>
          </button>
        }
      </div>
    </nav>
  </mat-sidenav>
  <mat-sidenav-content>
    <main class="h-full">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
