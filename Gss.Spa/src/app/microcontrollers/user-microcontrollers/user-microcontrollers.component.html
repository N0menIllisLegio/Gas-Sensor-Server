<div class="p-4 h-screen">
    <mat-card class="h-full" appearance="outlined">
        <mat-card-content class="h-full !flex flex-col">
            <div class="w-full flex gap-4">
                <mat-form-field class="flex-grow">
                    <mat-label>Filter</mat-label>
                    <input matInput [(ngModel)]="searchString" (ngModelChange)="loadMicrocontrollers()" placeholder="Search..." />
                </mat-form-field>

                <button mat-flat-button class="h-full mt-3" (click)="onCreateMicrocontroller()">Create Microcontroller</button>
            </div>
            <div class="overflow-auto flex-grow relative">
                @if (isTableLoading()) {
                    <spinner />
                }

                <table mat-table [dataSource]="dataSource()" matSort (matSortChange)="sortData($event)" style="background-color: inherit">
                    <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header="Name">Name</th>
                        <td mat-cell *matCellDef="let element">{{ element.name }}</td>
                    </ng-container>

                    <ng-container matColumnDef="coordinates">
                        <th mat-header-cell *matHeaderCellDef>Coordinates</th>
                        <td mat-cell *matCellDef="let element">
                            {{ { latitude: element.latitude, longitude: element.longitude } | coordinates | emptyPlaceholder }}
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="sensorsCount">
                        <th mat-header-cell *matHeaderCellDef>Sensors Connected</th>
                        <td mat-cell *matCellDef="let element">{{ element.sensors.length }}</td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                    <tr mat-row (click)="onRowClicked(row)" *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
            </div>

            <mat-paginator
                [length]="totalMicrocontrollers()"
                [pageIndex]="pageNumber"
                [pageSize]="pageSize"
                [pageSizeOptions]="[10, 30, 50]"
                (page)="onPageChanged($event.pageIndex, $event.pageSize)"
                showFirstLastButtons>
            </mat-paginator>
        </mat-card-content>
    </mat-card>
</div>

<style scoped>
.mat-mdc-table-sticky {
  background: var(--mat-sys-surface-container-highest) !important;
  opacity: 1;
}

.mat-mdc-row:hover .mat-mdc-cell {
  background-color: var(--mat-sys-surface-container-low);
  cursor: pointer;
}

.mat-column-icon {
  width: 32px;
  padding-right: 24px;
}

.mat-column-units {
  width: 64px;
  padding-right: 24px;
}
</style>
